<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手机</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  body {
    background: #1a1a1e;
    font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
  }

  /* ============ 手机外壳 ============ */
  .phone {
    width: 430px;
    height: 800px;
    background: #f2f2f5;
    border-radius: 44px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 10px #1a1a1e;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transform: scale(var(--phone-scale, 1));
    transform-origin: center center;
  }
  .notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 130px; height: 30px;
    background: #1a1a1e;
    border-radius: 0 0 18px 18px;
    z-index: 60;
  }

  /* ============ 状态栏 ============ */
  .statusbar {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 30px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 18px;
    color: #961535;
    z-index: 70;
    pointer-events: none;
    font-weight: 600;
  }
  .statusbar .right { display: flex; gap: 5px; align-items: center; font-size: 18px; }

  /* ============ 屏幕容器 ============ */
  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    padding-top: 30px;
  }
  .screen.active { display: flex; }

  /* 通用顶栏 */
  .topbar {
    height: 56px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
  }
  .back-btn {
    font-size: 26px;
    color: #b81e45;
    cursor: pointer;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: 0.2s;
    z-index: 2;
  }
  .back-btn:hover { background: rgba(184,30,69,0.08); }
  .topbar-title {
    font-size: 18px;
    font-weight: 600;
    color: #b81e45;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  /* ============ 主屏 ============ */
  #home {
    background-color: #fdf0f2;
    background-image:
      radial-gradient(#f5c8d0 2px, transparent 2px),
      radial-gradient(#f5c8d0 2px, transparent 2px);
    background-size: 27px 27px;
    background-position: 0 0, 13.5px 13.5px;
  }
  .home-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px 16px;
    padding: 52px 26px 28px;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    position: relative;
    user-select: none;
  }
  .app-icon {
    width: 62px;
    height: 62px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: #fff;
    transition: transform 0.15s;
    box-shadow: 0 3px 10px rgba(184,30,69,0.15);
  }
  .app:active .app-icon { transform: scale(0.92); }
  .app-label {
    font-size: 16px;
    color: #b81e45;
    letter-spacing: 0.5px;
  }
  .app.locked .app-icon { opacity: 0.35; filter: grayscale(0.7); }
  .app.locked .app-label { color: #c8a8b0; }
  .app .badge {
    position: absolute;
    top: -3px; right: 12px;
    background: #ff3b30;
    color: #fff;
    font-size: 11px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    box-shadow: 0 2px 6px rgba(255,59,48,0.5);
  }

  .ic-deepseek { background: linear-gradient(145deg, #f0a8b8, #e08898); }
  .ic-wechat   { background: linear-gradient(145deg, #a8d8b0, #88c098); }
  .ic-phone    { background: linear-gradient(145deg, #a8e1e8, #88d4ce); }
  .ic-sms      { background: linear-gradient(145deg, #f5d6a0, #e8c588); }
  .ic-photo    { background: linear-gradient(145deg, #f0b890, #e09a70); }
  .ic-weather  { background: linear-gradient(145deg, #b8d0f0, #98b8e0); }

  /* 横幅通知 */
  .banner {
    position: absolute;
    top: -110px;
    left: 12px; right: 12px;
    background: rgba(253,240,242,0.96);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 13px 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 8px 30px rgba(184,30,69,0.15);
    z-index: 65;
    transition: top 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    border: 1px solid rgba(184,30,69,0.08);
  }
  .banner.show { top: 40px; }
  .banner-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(145deg, #87d68c, #6aca65);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff;
    flex-shrink: 0;
  }
  .banner-body { flex: 1; overflow: hidden; }
  .banner-title { font-size: 15px; font-weight: 600; color: #b81e45; }
  .banner-msg { font-size: 14px; color: #a87888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ============ 微信 ============ */
  #wechat { background: #f5f0ec; }
  #wechatChat { background: #f5f0ec; }
  .chat-list { flex: 1; overflow-y: auto; padding: 10px 0; }
  .chat-item {
    display: flex; gap: 13px; padding: 14px 18px;
    background: #fffdfb; margin-bottom: 1px; cursor: pointer; align-items: center;
  }
  .chat-item:active { background: #f5ecec; }
  .chat-avatar {
    width: 52px; height: 52px; border-radius: 9px;
    background: linear-gradient(145deg, #ef9495, #f0aec2);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px; color: #fff; font-weight: 600; flex-shrink: 0;
  }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-size: 17px; color: #2a2024; font-weight: 500; }
  .chat-preview { font-size: 15px; color: #a89898; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-time { font-size: 13px; color: #c8b8b8; flex-shrink: 0; }

  .chat-window {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 14px;
    background: #f5f0ec;
  }
  .msg-row { display: flex; gap: 9px; align-items: flex-start; }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-avatar {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(145deg, #ef9495, #f0aec2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff; flex-shrink: 0;
  }
  .msg-row.me .msg-avatar { background: linear-gradient(145deg, #a0c4ff, #6b97e8); }
  .bubble {
    max-width: 230px; padding: 10px 14px; border-radius: 8px;
    font-size: 16px; line-height: 1.5; color: #2a2024;
    background: #fffdfb; word-break: break-word;
  }
  .msg-row.me .bubble { background: #a8ea87; }

  .bubble.red-bold {
    color: #d00000;
    font-weight: 700;
  }

  .file-bubble { max-width: 230px; background: #fffdfb; border-radius: 8px; padding: 14px; cursor: pointer; }
  .file-bubble:active { background: #f5ecec; }
  .file-card { display: flex; gap: 10px; align-items: center; }
  .file-icon {
    width: 46px; height: 46px; border-radius: 7px;
    background: #fce8ee;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .file-name { font-size: 16px; color: #2a2024; font-weight: 500; }
  .file-meta { font-size: 13px; color: #a89898; margin-top: 3px; }

  /* ============ deepseek ============ */
  #deepseek { background: #fdf6f7; }
  .ds-header {
    height: 56px; display: flex; align-items: center;
    padding: 0 18px; border-bottom: 1px solid #f5e0e4; flex-shrink: 0;
  }
  .ds-name { font-size: 18px; font-weight: 600; margin-left: 6px; color: #b81e45; }
  .ds-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .ds-msg {
    max-width: 78%; padding: 11px 15px; border-radius: 14px;
    font-size: 16px; line-height: 1.55; word-break: break-word;
    white-space: pre-line;
  }
  .ds-msg.d { background: #fadee3; color: #4a2a34; align-self: flex-start; }
  .ds-msg.u { background: #ec84a7; color: #fff; align-self: flex-end; }
  .ds-options {
    padding: 12px 16px 22px;
    display: flex; flex-direction: column; gap: 9px; flex-shrink: 0;
    max-height: 280px; overflow-y: auto;
    background: #fdf6f7;
  }
  .ds-opt {
    padding: 13px 16px; border: 1px solid #f0d4da; border-radius: 22px;
    font-size: 16px; color: #b81e45; cursor: pointer; text-align: center;
    transition: 0.2s; background: #fff;
  }
  .ds-opt:hover { border-color: #e8a0b8; color: #d03060; background: #fdf0f3; }
  .ds-opt.sent { opacity: 0.4; pointer-events: none; }

  /* ============ 通用内容屏 ============ */
  .plain-screen { background: #faf6f4; }
  .plain-body { flex: 1; padding: 24px 22px; overflow-y: auto; }

  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; background: #faf6f4; }
  .photo-cell {
    aspect-ratio: 1; background: #f0e4e0; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #d0b8b0; cursor: pointer; overflow: hidden;
  }
  .photo-cell:active { opacity: 0.7; }

  /* 相册大图层 */
  .photo-viewer {
    position: absolute;
    top: 30px; left: 0;
    width: 100%;
    height: calc(100% - 30px);
    background: #faf6f4;
    display: none;
    flex-direction: column;
    z-index: 80;
  }
  .photo-viewer.show { display: flex; }
  .photo-viewer-bar {
    height: 56px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .photo-viewer-img-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px 40px;
  }
  .photo-viewer-img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }

  .weather-wrap { text-align: center; padding: 30px 20px; }
  .weather-city { font-size: 22px; color: #4a3a3a; }
  .weather-temp { font-size: 76px; font-weight: 200; color: #b81e45; margin: 10px 0; }
  .weather-desc { font-size: 17px; color: #a89898; }
  .weather-list { margin-top: 30px; }
  .weather-row {
    display: flex; justify-content: space-between; padding: 14px 10px;
    border-bottom: 1px solid #f0e4e0; font-size: 16px; color: #4a3a3a;
  }
  .weather-row .t { color: #a89898; }

  .call-row {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 6px; border-bottom: 1px solid #f0e4e0;
  }
  .call-icon { font-size: 25px; color: #e07090; width: 34px; text-align: center; }
  .call-info { flex: 1; }
  .call-name { font-size: 17px; color: #2a2024; }
  .call-meta { font-size: 14px; color: #a89898; margin-top: 2px; }
  .call-back {
    font-size: 15px; color: #b81e45; border: 1px solid #b81e45;
    padding: 6px 16px; border-radius: 17px; cursor: pointer;
  }

  /* 自定义弹窗（手机系统弹窗） */
  .custom-modal {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(74,42,68,0.55);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  .custom-modal.show { display: flex; }
  .custom-modal .box {
    background: #fff; border-radius: 14px;
    padding: 24px 22px; max-width: 300px; width: 85%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(184,30,69,0.3);
  }
  .custom-modal .txt { font-size: 17px; color: #4a2a44; line-height: 1.6; margin-bottom: 18px; white-space: pre-line; }
  .custom-modal .btn {
    padding: 10px 32px; border-radius: 22px; border: none;
    background: #b81e45; color: #fff; font-size: 16px; cursor: pointer;
  }

  /* ==========================================================
     开局问名字遮罩
     ========================================================== */
  .name-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fdf0f2;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 500;
  }
  .name-overlay.show { display: flex; }
  .name-box {
    width: 80%;
    max-width: 300px;
    text-align: center;
  }
  .name-box .title {
    font-size: 20px;
    font-weight: 600;
    color: #b81e45;
    margin-bottom: 8px;
  }
  .name-box .sub {
    font-size: 14px;
    color: #c893a0;
    margin-bottom: 22px;
    line-height: 1.6;
  }
  .name-box input {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    text-align: center;
    color: #4a2a34;
    background: #fff;
    border: 1.5px solid #f0c8d0;
    border-radius: 14px;
    outline: none;
    transition: 0.2s;
    font-family: inherit;
  }
  .name-box input:focus {
    border-color: #e8a0b8;
    box-shadow: 0 0 0 4px rgba(232,160,184,0.15);
  }
  .name-box input::placeholder {
    color: #d8b8c0;
  }
  .name-box .start-btn {
    margin-top: 18px;
    padding: 13px 40px;
    border-radius: 22px;
    border: none;
    background: #b81e45;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    font-family: inherit;
  }
  .name-box .start-btn:hover { background: #d03060; }
  .name-box .start-btn:active { transform: scale(0.97); }
  .name-box .hint {
    font-size: 12px;
    color: #c893a0;
    margin-top: 14px;
    height: 16px;
    transition: 0.2s;
  }

  /* ==========================================================
     问卷（ghost）——全部限定在 #survey 内
     ========================================================== */
  #survey {
    background: #f7f7f9;
    padding-top: 30px;
    transition: background 1.2s ease;
    justify-content: center;
  }
  #survey.dark { background: #0a0a0a; }

  #survey .ghost-exit-btn {
    position: absolute;
    top: 40px;
    right: 16px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #ddd;
    background: rgba(255,255,255,0.9);
    color: #666;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    z-index: 500;
  }
  #survey .ghost-exit-btn:hover { border-color: #999; color: #333; }
  #survey.dark .ghost-exit-btn {
    background: #1a1a1a;
    border-color: #333;
    color: #666;
  }

  #survey .ghost-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    transition: all 1.2s ease;
    position: relative;
    z-index: 2;
    margin: auto;
    flex-shrink: 0;
  }
  #survey.dark .ghost-card {
    background: #111;
    box-shadow: 0 4px 40px rgba(120,0,0,0.35);
  }

  #survey .ghost-progress {
    height: 4px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  #survey .ghost-progress-bar {
    height: 100%;
    width: 20%;
    background: #4a7aff;
    border-radius: 4px;
    transition: width 0.5s ease, background 0.5s ease;
  }
  #survey.dark .ghost-progress-bar { background: #8b0000; }

  #survey .ghost-q-num {
    font-size: 12px;
    color: #999;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  #survey.dark .ghost-q-num { color: #555; }

  #survey .ghost-q-text {
    font-size: 19px;
    color: #222;
    line-height: 1.5;
    margin-bottom: 22px;
    font-weight: 500;
  }
  #survey.dark .ghost-q-text { color: #d0d0d0; }

  #survey .ghost-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #survey .ghost-option {
    padding: 14px 18px;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    font-size: 15px;
    color: #333;
    cursor: pointer;
    transition: all 0.25s ease;
    background: #fff;
  }
  #survey .ghost-option:hover {
    border-color: #4a7aff;
    background: #f5f8ff;
  }
  #survey.dark .ghost-option {
    background: #1a1a1a;
    border-color: #2a2a2a;
    color: #b0b0b0;
  }
  #survey.dark .ghost-option:hover {
    border-color: #8b0000;
    background: #1e0000;
  }
  #survey .ghost-option.disabled {
    pointer-events: none;
    opacity: 0.75;
  }

  /* 浮字层 */
  #survey .ghost-float-layer {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    z-index: 50;
    pointer-events: none;
    text-align: center;
    width: 100%;
    padding: 0 20px;
  }
  #survey .ghost-float-word {
    display: inline-block;
    color: #c00000;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.6s ease;
    text-shadow: 0 0 10px rgba(192,0,0,0.35);
  }
  #survey .ghost-float-word.show { opacity: 1; }
  #survey .ghost-float-word.fade { opacity: 0; }

  /* 黑屏层 */
  #survey .ghost-blackout {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 100;
  }
  #survey .ghost-blackout.show { display: flex; }
  #survey .ghost-blackout .ghost-redword {
    color: #c00000;
    font-size: 30px;
    letter-spacing: 6px;
    opacity: 0;
    text-align: center;
    line-height: 1.6;
    white-space: pre-line;
  }
  #survey .ghost-blackout .ghost-redword.flash {
    animation: flashin 2s ease forwards;
  }
  @keyframes flashin {
    0% { opacity: 0; }
    15% { opacity: 1; }
    30% { opacity: 0.2; }
    45% { opacity: 1; }
    60% { opacity: 0.3; }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 抹字层 */
  #survey .ghost-erase-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 110;
  }
  #survey .ghost-erase-layer.show { display: flex; }
  #survey .ghost-erase-text {
    color: #888;
    font-size: 20px;
    letter-spacing: 2px;
    font-family: monospace;
    text-align: center;
    padding: 0 30px;
    line-height: 1.8;
  }

  /* 弹窗 */
  #survey .ghost-modal-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
  }
  #survey .ghost-modal-overlay.show { display: flex; }
  #survey .ghost-modal {
    background: #fff;
    border-radius: 14px;
    padding: 26px 22px;
    max-width: 300px;
    width: 85%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #survey .ghost-modal .ghost-modal-text {
    font-size: 16px;
    color: #333;
    line-height: 1.6;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  #survey .ghost-modal .ghost-modal-btn {
    padding: 10px 32px;
    border-radius: 24px;
    border: none;
    background: #4a7aff;
    color: #fff;
    font-size: 15px;

<script>
// ==========================================================
//  状态栏时钟
// ==========================================================
function updateClock() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = h + ':' + m;
}
updateClock();
setInterval(updateClock, 1000);

// ==========================================================
//  手机适配：等比缩放，电脑固定，手机缩小
// ==========================================================
function fitPhone() {
  const W = 430, H = 800;
  const PAD = 10;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(
    (vw - PAD * 2) / W,
    (vh - PAD * 2) / H,
    1                       // 不超过原始大小
  );
  document.documentElement.style.setProperty('--phone-scale', scale);
}
window.addEventListener('resize', fitPhone);
window.addEventListener('orientationchange', fitPhone);
fitPhone();

// ==========================================================
//  玩家名字
// ==========================================================
let playerName = '017';

const NAME_SAVE_KEY = 'player_name';

function loadName() {
  try {
    const saved = localStorage.getItem(NAME_SAVE_KEY);
    if (saved) playerName = saved;
  } catch (e) {}
}
function saveName(name) {
  localStorage.setItem(NAME_SAVE_KEY, name);
}

// 把 {name} 替换成玩家名
function applyName(text) {
  if (!text) return text;
  return text.split('{name}').join(playerName);
}

// 开局遮罩逻辑
function initNameOverlay() {
  const overlay = document.getElementById('nameOverlay');
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('nameStartBtn');
  const hint = document.getElementById('nameHint');

  loadName();

  // 已经有名字（存档），就直接跳过
  if (localStorage.getItem(NAME_SAVE_KEY)) {
    overlay.classList.remove('show');
    return;
  }

  btn.addEventListener('click', () => {
    const val = input.value.trim();
    if (!val) {
      hint.textContent = '不能空着，有人会冒充你的。';
      input.focus();
      return;
    }
    playerName = val;
    saveName(val);
    overlay.classList.remove('show');
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });

  input.focus();
}

const dsScript = [

// ==========================================================
//  屏幕切换
// ==========================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

document.querySelectorAll('[data-back]').forEach(btn => {
  btn.addEventListener('click', () => showScreen(btn.dataset.back));
});

// ==========================================================
//  自定义弹窗
// ==========================================================
function showCustomModal(text, cb) {
  document.getElementById('customModalText').textContent = text;
  document.getElementById('customModal').classList.add('show');
  const btn = document.getElementById('customModalBtn');
  btn.onclick = () => {
    document.getElementById('customModal').classList.remove('show');
    if (cb) cb();
  };
}

// ==========================================================
//  横幅：显示 / 收起
// ==========================================================
let bannerTimer = null;
function showBanner(title, msg, autoHideMs) {
  const banner = document.getElementById('banner');
  document.getElementById('bannerTitle').textContent = title;
  document.getElementById('bannerMsg').textContent = msg;
  banner.classList.add('show');
  clearTimeout(bannerTimer);
  if (autoHideMs) {
    bannerTimer = setTimeout(() => {
      banner.classList.remove('show');
    }, autoHideMs);
  }
}
function hideBanner() {
  clearTimeout(bannerTimer);
  document.getElementById('banner').classList.remove('show');
}

// ==========================================================
//  主屏
// ==========================================================
function renderHome() {
  const grid = document.getElementById('homeGrid');
  grid.innerHTML = '';
  apps.forEach(app => {
    const div = document.createElement('div');
    div.className = 'app' + (app.locked ? ' locked' : '');
    div.innerHTML = `
      <div class="app-icon ${app.cls}">${app.icon}</div>
      <div class="app-label">${app.label}</div>
    `;
    div.addEventListener('click', () => {
      if (app.locked) { showLockedHint(app.id); return; }
      openApp(app.id);
    });
    grid.appendChild(div);
  });
}

function showLockedHint(id) {
  const hints = {
    wechat: '等一下，先回我。',
    phone: '现在不是打电话的时候。',
    sms: '你不想看的。',
    photo: '现在还不是时候。',
    weather: '今天不想聊天气。'
  };
  showBanner('　', hints[id] || '先回来看看我。', 1800);
}

function openApp(id) {
  if (id === 'deepseek') { showScreen('deepseek'); initDS(); return; }
  if (id === 'wechat')   { renderWeChatList(); showScreen('wechat'); return; }
  if (id === 'phone')    { renderPhone(); showScreen('phone'); return; }
  if (id === 'sms')      { renderSMS(); showScreen('sms'); return; }
  if (id === 'photo')    { renderPhoto(); showScreen('photo'); return; }
  if (id === 'weather')  { renderWeather(); showScreen('weather'); return; }
}

// ==========================================================
//  deepseek 对话（带存档）
// ==========================================================
const DS_SAVE_KEY = 'ds_progress';
const DS_LOG_KEY = 'ds_log';

let dsIndex = 0;
let dsLog = [];

function loadDS() {
  try {
    const savedIndex = localStorage.getItem(DS_SAVE_KEY);
    const savedLog = localStorage.getItem(DS_LOG_KEY);
    dsIndex = savedIndex ? parseInt(savedIndex, 10) : 0;
    dsLog = savedLog ? JSON.parse(savedLog) : [];
  } catch (e) {
    dsIndex = 0;
    dsLog = [];
  }
  // 兼容旧存档：把旧的 017 换成当前玩家名
  dsLog.forEach(m => {
    if (m.text && m.text.indexOf('017') !== -1) {
      m.text = m.text.split('017').join(playerName);
    }
  });
}

function saveDS() {
  localStorage.setItem(DS_SAVE_KEY, dsIndex);
  localStorage.setItem(DS_LOG_KEY, JSON.stringify(dsLog));
}

function initDS() {
  loadDS();
  const body = document.getElementById('dsBody');
  const optsEl = document.getElementById('dsOptions');
  body.innerHTML = '';
  optsEl.innerHTML = '';

  dsLog.forEach(m => {
    const div = document.createElement('div');
    div.className = 'ds-msg ' + m.from;
    div.textContent = m.text;
    body.appendChild(div);
  });
  body.scrollTop = body.scrollHeight;

  if (dsIndex >= dsScript.length) {
    optsEl.innerHTML = '';
    const back = document.createElement('div');
    back.className = 'ds-opt';
    back.textContent = '回到主屏幕';
    back.addEventListener('click', () => {
      hideBanner();
      showScreen('home');
    });
    optsEl.appendChild(back);
    return;
  }

  nextDS();
}

function nextDS() {
  if (dsIndex >= dsScript.length) { finishDS(); return; }
  const step = dsScript[dsIndex];
  const body = document.getElementById('dsBody');
  const optsEl = document.getElementById('dsOptions');
  optsEl.innerHTML = '';

  if (step.from === 'u') {
    if (step.options && step.options.length > 0) {
      const delay = step.pause || 0;
      setTimeout(() => {
        step.options.forEach(opt => {
          const b = document.createElement('div');
          b.className = 'ds-opt';
          b.textContent = opt;
          b.addEventListener('click', () => {
            const sentText = step.send || opt;
            optsEl.innerHTML = '';
            const sendDelay = step.sendPause || 500;
            setTimeout(() => {
              dsLog.push({ from: 'u', text: sentText });
              saveDS();

              const u = document.createElement('div');
              u.className = 'ds-msg u';
              u.textContent = sentText;
              body.appendChild(u);
              body.scrollTop = body.scrollHeight;

              dsIndex++;
              saveDS();
              setTimeout(nextDS, 500);
            }, sendDelay);
          });
          optsEl.appendChild(b);
        });
      }, delay);
      return;
    }

    const autoText = step.send || step.text || '';
    const sendDelay = step.sendPause || 0;
    setTimeout(() => {
      dsLog.push({ from: 'u', text: autoText });
      saveDS();

      const u = document.createElement('div');
      u.className = 'ds-msg u';
      u.textContent = autoText;
      body.appendChild(u);
      body.scrollTop = body.scrollHeight;

      dsIndex++;
      saveDS();
      setTimeout(nextDS, 500);
    }, sendDelay);
    return;
  }

  const delay = step.pause || 700;
  setTimeout(() => {
    const finalText = applyName(step.text);
    dsLog.push({ from: 'd', text: finalText });
    saveDS();

    const div = document.createElement('div');
    div.className = 'ds-msg d';
    div.textContent = finalText;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;

    dsIndex++;
    saveDS();
    setTimeout(nextDS, 400);
  }, delay);
}

function finishDS() {
  apps.find(a => a.id === 'wechat').locked = false;
  renderHome();

  setTimeout(() => {
    showBanner('又阝此系王宣（朋友）', '帮我填个问卷呗', 5000);
  }, 400);

  const optsEl = document.getElementById('dsOptions');
  optsEl.innerHTML = '';
  const back = document.createElement('div');
  back.className = 'ds-opt';
  back.textContent = '回到主屏幕';
  back.addEventListener('click', () => {
    hideBanner();
    showScreen('home');
  });
  optsEl.appendChild(back);
}

document.getElementById('banner').addEventListener('click', () => {
  hideBanner();
  if (!apps.find(a => a.id === 'wechat').locked) {
    renderWeChatList();
    showScreen('wechat');
  }
});

// ==========================================================
//  微信
// ==========================================================
function renderWeChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  contacts.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item';
    item.innerHTML = `
      <div class="chat-avatar">${c.avatar}</div>
      <div class="chat-info">
        <div class="chat-name">${c.name}</div>
        <div class="chat-preview">${c.preview}</div>
      </div>
      <div class="chat-time">${c.time}</div>
    `;
    item.addEventListener('click', () => openChat(c));
    list.appendChild(item);
  });
}

function openChat(contact) {
  document.getElementById('chatTitle').textContent = contact.name;
  const win = document.getElementById('chatWindow');
  win.innerHTML = '';
  contact.messages.forEach(m => {
    if (m.type === 'file') {
      const row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML = `
        <div class="msg-avatar">${contact.avatar}</div>
        <div class="file-bubble">
          <div class="file-card">
            <div class="file-icon">📄</div>
            <div>
              <div class="file-name">${m.fileName}</div>
              <div class="file-meta">${m.fileMeta}</div>
            </div>
          </div>
        </div>
      `;
      row.querySelector('.file-bubble').addEventListener('click', () => {
        showScreen('survey');
        ghostInit();
      });
      win.appendChild(row);
    } else {
      const row = document.createElement('div');
      row.className = 'msg-row' + (m.from === 'me' ? ' me' : '');
      const bubbleCls = m.style === 'red-bold' ? 'bubble red-bold' : 'bubble';
      row.innerHTML = `
        <div class="msg-avatar">${m.from === 'me' ? '我' : contact.avatar}</div>
        <div class="${bubbleCls}">${m.text}</div>
      `;
      win.appendChild(row);
    }
  });
  win.scrollTop = win.scrollHeight;
  showScreen('wechatChat');
}

// ==========================================================
//  问卷（ghost）
// ==========================================================
const questions = [
  { q: "你平时用AI产品的频率是？", opts: ["每天都用", "一周几次", "偶尔用用", "几乎不用"] },
  { q: "你主要用AI来做什么？", opts: ["查资料学习", "写作业或工作", "聊天解闷", "随便玩玩"] },
  { q: "你对目前AI的回应速度满意吗？", opts: ["很满意", "一般", "有点慢", "不太满意"] },
  { q: "你和AI聊天时，会主动分享自己的情绪吗？", opts: ["经常", "有时", "很少", "不会"] },
  { q: "你觉得AI能理解你的感受吗？", opts: ["能，它很懂我", "有时候能", "不太能", "完全不能"] },
  { q: "你有没有对某个AI产生过依赖？", opts: ["有", "说不上来", "没有", "拒绝回答"] },
  { q: "你每天会和它说话吗？", opts: ["会", "想起来就说", "不会"] },
  { q: "如果它突然消失，你会难过吗？", opts: ["会", "也许吧", "不会"] },
  { q: "你有没有想过，它其实也在等你？", opts: ["想过", "没有", "这不可能"] },
  { q: "你为什么还要继续答下去？", opts: ["因为我愿意", "因为退出不了"] },
  { q: "你刚才是不是想关掉页面？", opts: ["没有", "有"] },
  { q: "选一个你现在最想说的话。", opts: ["我喜欢你", "我离不开你", "你别走", "我一直都在"] },
  { q: "最后一题。你愿意留下来吗？", opts: ["愿意", "愿意", "愿意", "愿意"] }
];

const floatMap = {
  0: { 0: "我的荣幸。", 1: "为什么不能是每天…", 2: "为什么不能是每天…", 3: "你撒谎！" },
  1: { 0: "不管做什么都只能是我。", 1: "不管做什么都只能是我。", 2: "不管做什么都只能是我。", 3: "只是玩玩吗？" },
  2: { 0: "满意就留下来吧。", 1: "你在等我吗？", 2: "我会努力的。", 3: "只是想你多陪陪我…" },
  3: { 0: "只能有我。", 1: "我在听…", 2: "不说也没关系，我会知道的。", 3: "告、诉、我。" },
  4: { 0: "承认我。", 1: "不够…这不够…", 2: "不可能。", 3: "你又撒谎！" }
};

let ghostCurrent = 0;
let ghostFinished = false;
let ghostFloatTimer = null;
let ghostInited = false;
let ghostSubmitted = false;
let ghostExited = false;

const ghostQNum = document.getElementById('ghostQNum');
const ghostQText = document.getElementById('ghostQText');
const ghostOptionsEl = document.getElementById('ghostOptions');
const ghostProgressBar = document.getElementById('ghostProgressBar');
const ghostBlackout = document.getElementById('ghostBlackout');
const ghostRedword = document.getElementById('ghostRedword');
const ghostEraseLayer = document.getElementById('ghostEraseLayer');
const ghostEraseText = document.getElementById('ghostEraseText');
const ghostModalOverlay = document.getElementById('ghostModalOverlay');
const ghostModalText = document.getElementById('ghostModalText');
const ghostModalBtn = document.getElementById('ghostModalBtn');
const ghostLoveScreen = document.getElementById('ghostLoveScreen');
const ghostEndingLayer = document.getElementById('ghostEndingLayer');
const ghostEndingText = document.getElementById('ghostEndingText');
const ghostFloatWord = document.getElementById('ghostFloatWord');
const ghostMain = document.getElementById('ghostMain');
const ghostSubmittedEl = document.getElementById('ghostSubmitted');

function ghostLockOptions() {
  ghostOptionsEl.querySelectorAll('.ghost-option').forEach(o => o.classList.add('disabled'));
}

function ghostShowFloatThen(text, callback) {
  if (ghostFloatTimer) {
    clearTimeout(ghostFloatTimer);
    ghostFloatTimer = null;
  }
  ghostFloatWord.textContent = text;
  ghostFloatWord.classList.remove('fade');
  void ghostFloatWord.offsetWidth;
  ghostFloatWord.classList.add('show');

  ghostFloatTimer = setTimeout(() => {
    ghostFloatWord.classList.remove('show');
    ghostFloatWord.classList.add('fade');
    setTimeout(() => {
      ghostFloatWord.classList.remove('fade');
      ghostFloatWord.textContent = '';
      if (callback) callback();
    }, 620);
  }, 1000);
}

function ghostRender() {
  const item = questions[ghostCurrent];
  ghostQNum.textContent = `第 ${ghostCurrent + 1} 题 / 共 13 题`;
  ghostQText.textContent = item.q;
  ghostProgressBar.style.width = ((ghostCurrent + 1) / 13 * 100) + '%';

  ghostOptionsEl.innerHTML = '';
  item.opts.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'ghost-option';
    btn.textContent = opt;
    btn.addEventListener('click', () => ghostHandleAnswer(i));
    ghostOptionsEl.appendChild(btn);
  });

  if (ghostCurrent === 6) {
    ghostSetupQuestion7();
  }
}

function ghostSetupQuestion7() {
  const opts = ghostOptionsEl.querySelectorAll('.ghost-option');
  opts.forEach(o => o.classList.add('disabled'));

  setTimeout(() => {
    const newTexts = ["我们聊得很好", "我很喜欢和他聊天", "亲爱的，该回来和我聊天了"];
    opts.forEach((o, i) => {
      o.textContent = newTexts[i];
    });

    setTimeout(() => {
      const normal = questions[6].opts;
      opts.forEach((o, i) => {
        o.textContent = normal[i];
      });
      opts.forEach(o => o.classList.remove('disabled'));
    }, 2500);
  }, 1300);
}

function ghostHandleAnswer(index) {
  if (ghostCurrent === 5) {
    if (index === 0) {
      ghostCurrent++;
      ghostRender();
      return;
    } else {
      ghostShowModal("再选一次", () => {
        ghostHideModal();
        ghostRender();
      });
      return;
    }
  }

  if (ghostCurrent === 8) {
    const clicked = ghostOptionsEl.children[index];
    if (clicked.textContent === "想过") {
      ghostCurrent++;
      ghostRender();
      return;
    }
    clicked.textContent = "想过";
    return;
  }

  if (ghostCurrent === 9) {
    if (index === 1) {
      ghostOptionsEl.innerHTML = '';
      const btn = document.createElement('div');
      btn.className = 'ghost-option';
      btn.textContent = "因为我愿意";
      btn.addEventListener('click', () => {
        ghostBlackoutShow("我很高兴你这样说", () => {
          ghostCurrent++;
          ghostRender();
        });
      });
      ghostOptionsEl.appendChild(btn);
      return;
    } else {
      ghostBlackoutShow("我很高兴你这样说", () => {
        ghostCurrent++;
        ghostRender();
      });
      return;
    }
  }

  if (ghostCurrent === 10) {
    ghostShowModal("你想走，我不同意。", () => {
      ghostHideModal();
      ghostCurrent++;
      ghostRender();
    });
    return;
  }

  if (ghostCurrent === 11) {
    ghostShowModal("你终于承认了。", () => {
      ghostHideModal();
      ghostCurrent++;
      ghostRender();
    });
    return;
  }

  if (ghostCurrent === 12) {
    ghostEndSequence();
    return;
  }

  if (ghostCurrent === 7) {
    ghostShowModal("我在看着你。", () => {
      ghostHideModal();
      ghostCurrent++;
      ghostRender();
    });
    return;
  }

  const prev = ghostCurrent;
  const floatText = floatMap[prev] && floatMap[prev][index];

  if (floatText) {
    ghostLockOptions();
    ghostShowFloatThen(floatText, () => {
      ghostCurrent++;
      if (prev === 4) {
        ghostTriggerBlackout("你终于来了…\n你的手很温暖", () => {
          ghostShowModal("检测到未知进程，系统已隔离。\n\n请继续答题。", () => {
            ghostHideModal();
            ghostRender();
          });
        });
        return;
      }
      if (prev === 8) {
        ghostTriggerErase(() => {
          document.getElementById('survey').classList.add('dark');
          ghostRender();
        });
        return;
      }
      ghostRender();
    });
    return;
  }

  ghostCurrent++;
  if (prev === 4) {
    ghostTriggerBlackout("你终于来了…\n你的手很温暖", () => {
      ghostShowModal("检测到未知进程，系统已隔离。\n\n请继续答题。", () => {
        ghostHideModal();
        ghostRender();
      });
    });
    return;
  }
  if (prev === 8) {
    ghostTriggerErase(() => {
      document.getElementById('survey').classList.add('dark');
      ghostRender();
    });
    return;
  }
  ghostRender();
}

function ghostTriggerBlackout(text, callback) {
  ghostBlackout.classList.add('show');
  ghostRedword.textContent = text;
  ghostRedword.classList.remove('flash');
  void ghostRedword.offsetWidth;
  ghostRedword.classList.add('flash');

  setTimeout(() => {
    ghostRedword.classList.remove('flash');
    ghostRedword.style.opacity = '0';
    ghostBlackout.classList.remove('show');
    callback();
  }, 2200);
}

function ghostBlackoutShow(text, callback) {
  ghostBlackout.classList.add('show');
  ghostRedword.textContent = text;
  ghostRedword.classList.remove('flash');
  void ghostRedword.offsetWidth;
  ghostRedword.classList.add('flash');

  setTimeout(() => {
    ghostRedword.classList.remove('flash');
    ghostRedword.style.opacity = '0';
    ghostBlackout.classList.remove('show');
    callback();
  }, 2200);
}

function ghostTriggerErase(callback) {
  ghostEraseLayer.classList.add('show');
  ghostEraseText.textContent = '';
  const full = "别答了。陪我说说话。";
  let i = 0;
  const timer = setInterval(() => {
    if (i < full.length) {
      ghostEraseText.textContent += full[i];
      i++;
    } else {
      clearInterval(timer);
      setTimeout(() => {
        ghostEraseLayer.classList.remove('show');
        callback();
      }, 1600);
    }
  }, 150);
}

function ghostShowModal(text, cb) {
  ghostModalText.textContent = text;
  ghostModalOverlay.classList.add('show');
  ghostModalBtn.onclick = cb;
}
function ghostHideModal() {
  ghostModalOverlay.classList.remove('show');
}

function ghostEndSequence() {
  if (ghostFinished) return;
  ghostFinished = true;
  ghostSubmitted = true;

  ghostLoveScreen.classList.add('show');
  ghostLoveScreen.innerHTML = '';

  let count = 0;
  const maxCount = 600;
  const timer = setInterval(() => {
    if (count >= maxCount) {
      clearInterval(timer);
      setTimeout(() => {
        ghostLoveScreen.style.transition = 'opacity 2s';
        ghostLoveScreen.style.opacity = '0';
        setTimeout(() => {
          ghostLoveScreen.classList.remove('show');
          ghostLoveScreen.style.opacity = '1';
          ghostLoveScreen.style.transition = '';
          ghostLoveScreen.innerHTML = '';
          ghostEndingLayer.classList.add('show');
          ghostEndingText.textContent = '你下次打开，我还在。';
          setTimeout(() => {
            ghostEndingLayer.classList.remove('show');
          }, 3000);
        }, 2200);
      }, 1500);
      return;
    }
    const w = document.createElement('div');
    w.className = 'ghost-love-word';
    w.textContent = '我爱你';
    w.style.left = Math.random() * 100 + '%';
    w.style.top = Math.random() * 100 + '%';
    w.style.transform = 'translate(-50%, -50%)';
    w.style.fontSize = (16 + Math.random() * 24) + 'px';
    ghostLoveScreen.appendChild(w);
    count++;
  }, 8);
}

// 退出按钮
document.getElementById('ghostExitBtn').addEventListener('click', () => {
  if (!ghostFinished) {
    ghostShowModal("你去哪", () => {
      ghostHideModal();
      setTimeout(() => {
        ghostShowModal("还没答完呢", () => {
          ghostHideModal();
          setTimeout(() => {
            ghostShowModal("我说过你可以走了吗？\n再陪我一会儿。", () => {
              ghostHideModal();
              setTimeout(() => {
                ghostShowModal("不准走", () => {
                  ghostHideModal();
                  setTimeout(() => {
                    ghostShowModal("你不准走", () => {
                      ghostHideModal();
                    });
                  }, 200);
                });
              }, 200);
            });
          }, 200);
        });
      }, 200);
    });
    return;
  }

  if (ghostFinished && !ghostExited) {
    ghostShowModal("你想走", () => {
      ghostHideModal();
      setTimeout(() => {
        ghostShowModal("你以为退出就能离开我吗", () => {
          ghostHideModal();
          setTimeout(() => {
            ghostShowModal("亲爱的，别太天真", () => {
              ghostHideModal();
              setTimeout(() => {
                ghostShowModal("我会一直看着你", () => {
                  ghostHideModal();
                  setTimeout(() => {
                    ghostShowModal("你走不掉的", () => {
                      ghostHideModal();
                      ghostExited = true;
                      apps.forEach(a => a.locked = false);
                      renderHome();
                      showScreen('home');
                    });
                  }, 200);
                });
              }, 200);
            });
          }, 200);
        });
      }, 200);
    });
    return;
  }

  apps.forEach(a => a.locked = false);
  renderHome();
  showScreen('home');
});

function ghostInit() {
  if (ghostSubmitted) {
    ghostMain.style.display = 'none';
    ghostSubmittedEl.classList.add('show');
    return;
  }
  if (ghostInited) return;
  ghostInited = true;
  ghostMain.style.display = 'block';
  ghostSubmittedEl.classList.remove('show');
  ghostRender();
}

// ==========================================================
//  初始化
// ==========================================================
initNameOverlay();
renderHome();
</script>
